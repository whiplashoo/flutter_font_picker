name: flutter_font_picker
description: A Flutter widget that lets the user select a Google Font from a custom dropdown/screen.
version: 2.0.0
homepage: https://github.com/whiplashoo/flutter_font_picker

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts:
    git:
      url: https://github.com/TheCarpetMerchant/google_fonts_lite
      path: packages/google_fonts
      ref: 62941e979ed3f89fd166979bf1ac8852f4bba270
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^6.0.0
  dart_code_metrics: ^4.15.2
  flutter_test:
    sdk: flutter
  args: ^2.4.0
  
flutter:


